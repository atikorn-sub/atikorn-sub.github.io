<!DOCTYPE html>

<head>

  <meta name="description" content="Online resume of Atikorn Subsuieng — K2 & SQL Software Developer growing into a Full-stack Developer.">

  <!-- ฟอนต์จาก Google Fonts: IBM Plex Sans Thai (อ่านง่ายทั้งไทย/อังกฤษ) + JetBrains Mono (ฟอนต์สายโค้ด) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- ===== แถบเมนูด้านบน ===== -->
  <header class="topbar">
    <a class="brand" href="#top">AS<span>.</span></a>
    <nav class="nav">
      <a href="#about" data-i18n="navAbout">About</a>
      <a href="#skills" data-i18n="navSkills">Skills</a>
      <a href="#experience" data-i18n="navExperience">Experience</a>
      <a href="#projects" data-i18n="navProjects">Projects</a>
      <a href="#education" data-i18n="navEducation">Education</a>
    </nav>
    <div class="controls">
      <button id="langBtn" class="pill" type="button" aria-label="Switch language">ไทย</button>

      <p class="tagline" id="tagline"></p>
      <div class="hero-links">
        <a class="btn primary" href="mailto:atikorn.sub@gmail.com">
          <span>✉</span> <span data-i18n="contactMe">Contact me</span>
        </a>
        <a class="btn" href="https://github.com/atikorn-sub" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>

        </a>
      </div>
      <ul class="meta">
        <li><span class="dot"></span><span id="location"></span></li>
        <li class="mono">atikorn.sub@gmail.com</li>
      </ul>
    </section>

    <!-- ===== เกี่ยวกับฉัน ===== -->
    <section id="about" class="section">
      <h2><span class="mono num">01.</span> <span data-i18n="navAbout">About</span></h2>
      <p id="aboutText" class="lead"></p>
      <div class="stats" id="stats"></div>
    </section>

    <!-- ===== ทักษะ ===== -->
    <section id="skills" class="section">
      <h2><span class="mono num">02.</span> <span data-i18n="navSkills">Skills</span></h2>
      <div class="skill-grid" id="skillList"></div>
    </section>

    <!-- ===== ประสบการณ์ทำงาน ===== -->
    <section id="experience" class="section">
      <h2><span class="mono num">03.</span> <span data-i18n="navExperience">Experience</span></h2>
      <ol class="timeline" id="expList"></ol>
    </section>

    <!-- ===== โปรเจค ===== -->
    <section id="projects" class="section">
      <h2><span class="mono num">04.</span> <span data-i18n="navProjects">Projects</span></h2>
      <div class="project-grid" id="projList"></div>
    </section>

    <!-- ===== การศึกษา ===== -->
    <section id="education" class="section">
      <h2><span class="mono num">05.</span> <span data-i18n="navEducation">Education</span></h2>

  <footer class="footer">
